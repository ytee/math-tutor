<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Interactive math tutor for school to university"/>
  <title>Math Tutor</title>

  <!-- KaTeX -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"
        crossorigin="anonymous"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --bg2:       #f8f7f4;
      --text:      #1a1a1a;
      --text2:     #5a5a5a;
      --accent:    #4a6cf7;
      --accent-bg: #eef1fe;
      --border:    #e2e0d8;
      --radius:    10px;
      --correct:   #d4edda;
      --wrong:     #f8d7da;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    nav .brand {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--text2);
      text-decoration: none;
      font-size: 0.9rem;
    }
    nav a:hover { color: var(--accent); }

    /* ── Page container ── */
    .page {
      max-width: 760px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; }
    h2 { font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    p  { margin-bottom: 1rem; color: var(--text2); }

    /* ── Lesson sections ── */
    .section {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .section .math-display {
      margin: 0.75rem 0 0;
      text-align: center;
    }
    .example-block {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1rem 0;
    }
    .hint { font-size: 0.875rem; color: var(--text2); font-style: italic; }

    /* ── Quiz ── */
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      margin: 0.5rem 0;
      padding: 0.85rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .quiz-option:hover:not(:disabled) {
      background: var(--accent-bg);
      border-color: var(--accent);
    }
    .quiz-option.correct { background: var(--correct); border-color: #28a745; }
    .quiz-option.wrong   { background: var(--wrong);   border-color: #dc3545; }
    .quiz-option:disabled { cursor: default; }

    .question-block { margin-bottom: 2rem; }
    .question-text  { font-weight: 500; margin-bottom: 0.75rem; font-size: 1.05rem; }

    .score-card {
      background: var(--accent-bg);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      margin-top: 2rem;
    }
    .score-card h2 { color: var(--accent); margin: 0 0 0.5rem; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    /* ── Grade cards on home ── */
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .grade-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .grade-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(74,108,247,0.1);
    }
    .grade-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .grade-card p  { font-size: 0.85rem; margin: 0; }

    /* ── Lesson list ── */
    .lesson-list { list-style: none; margin-top: 1rem; }
    .lesson-list li {
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lesson-list li:last-child { border-bottom: none; }
    .lesson-list a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .lesson-list a:hover { text-decoration: underline; }

    /* ── Loading / error ── */
    .loading { color: var(--text2); padding: 2rem 0; }
    .error   { color: #dc3545; padding: 1rem 0; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      nav { gap: 1rem; }
      .page { margin: 1rem auto; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <p style="padding:2rem;color:#999">Loading…</p>
  </div>
  <script src="/js/main.js"></script>
</body>
</html>
